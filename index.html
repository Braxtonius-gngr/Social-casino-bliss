<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Casino Almanac</title>

  <!-- Accessibility, SEO & Social meta -->
  <meta name="description" content="The Casino Almanac — curated tracker for social casino apps with neon UI and strategy tools." />
  <meta property="og:title" content="The Casino Almanac" />
  <meta property="og:description" content="Curated tracker for social casino apps." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/og-image.png" />
  <meta name="theme-color" content="#05070d" />

  <!-- Local accessibility helpers (focus, reduced-motion, skip-link) -->
  <link rel="stylesheet" href="assets/accessibility.css" />
  <script defer src="assets/accessibility.js"></script>

  <style>
    :root {
      /* Deep Cyber Glass / AMOLED Colors */
      --bg-base: #05070d;
      --bg-surface: rgba(13, 18, 30, 0.75);
      --bg-card: rgba(18, 26, 42, 0.65);
      --bg-card-active: rgba(26, 36, 58, 0.85);
      
      --border-subtle: rgba(255, 255, 255, 0.09);
      --border-focus: rgba(0, 242, 254, 0.6);
      
      /* Vibrant Luminescent Palette */
      --neon-gold: #ffc400;
      --neon-gold-glow: rgba(255, 196, 0, 0.65);
      --neon-cyan: #00f2fe;
      --neon-cyan-glow: rgba(0, 242, 254, 0.65);
      
      /* Electric Neon Forest Green */
      --neon-forest: #00e676;
      --neon-forest-glow: rgba(0, 230, 118, 0.6);
      --neon-forest-border: rgba(0, 230, 118, 0.45);
      
      /* Vivid Purple & Magentas */
      --neon-purple: #c084fc;
      --neon-purple-glow: rgba(192, 132, 252, 0.6);
      --neon-magenta: #ff2a6d;
      --neon-magenta-glow: rgba(255, 42, 109, 0.6);
      --neon-orange: #ff7700;
      --neon-orange-glow: rgba(255, 119, 0, 0.55);

      /* Text */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      /* Standard Tiers */
      --tier-s: #ff2a5f; 
      --tier-a: #ff7700; 
      --tier-b: #3b82f6; 
      --tier-c: #64748b; 
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% -15%, #182240 0%, #0c1220 40%, var(--bg-base) 85%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px 125px;
      overflow-x: hidden;
    }

    .app-container {
      max-width: 640px;
      margin: 0 auto;
      position: relative;
    }

    /* Top Bar */
    .top-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .date-header {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--neon-purple);
      text-shadow: 0 0 12px var(--neon-purple-glow);
    }

    .btn-settings-gear {
      background: transparent;
      border: none;
      color: var(--neon-cyan);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px;
      transition: all 0.25s ease;
      filter: drop-shadow(0 0 10px var(--neon-cyan-glow));
    }
    
    .btn-settings-gear:hover {
      transform: rotate(60deg) scale(1.1);
    }

    /* Ultra-Luminescent Split Title */
    .app-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 2.15rem;
      font-weight: 900;
      margin-bottom: 22px;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
    }
    
    .app-title .title-casino {
      color: #ffffff;
      letter-spacing: 0.08em;
      text-shadow: 
        0 0 4px #ffffff,
        0 0 12px var(--neon-cyan),
        0 0 24px var(--neon-cyan),
        0 0 45px rgba(0, 242, 254, 0.7);
    }

    .app-title .title-almanac {
      color: #ffffff;
      letter-spacing: 0.06em;
      text-shadow: 
        0 0 4px #ffffff,
        0 0 12px var(--neon-gold),
        0 0 26px var(--neon-gold),
        0 0 50px rgba(255, 196, 0, 0.75);
    }

    /* ...rest of original CSS unchanged... */
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content" style="position:absolute;left:-999px;top:auto;width:1px;height:1px;overflow:hidden;">Skip to content</a>

  <!-- header banner -->
  <header role="banner" aria-label="App header">
    <div class="top-bar-row">
      <div class="date-header">Today</div>
      <button class="btn-settings-gear" aria-label="Settings">⚙</button>
    </div>

    <div class="app-title">
      <div class="title-casino">Casino</div>
      <div class="title-almanac">Almanac</div>
    </div>
  </header>

  <main id="main-content" role="main">
    <div class="app-container">
      <!-- existing app content kept unchanged below -->

      <!-- hero, nav, lists, ledger cards, etc. -->

      <!-- Landing screen example (ensure landing button has aria-label) -->
      <div class="landing-screen" id="landing-screen">
        <h1 class="landing-title">The Casino Almanac <span>Beta</span></h1>
        <p class="landing-subtitle">Curated tracker for social casino apps.</p>
        <button class="landing-btn" aria-label="Enter the app">Start</button>
      </div>

      <!-- Rest of the original body content remains unchanged. -->

    </div>
  </main>

  <footer role="contentinfo">
    <div class="docked-footer" aria-label="App actions">
      <button class="btn-dock primary-add" aria-label="Add">Add</button>
      <button class="btn-dock primary-import" aria-label="Import">Import</button>
    </div>
  </footer>
</body>
</html>
