<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dev Auth</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.6 monospace; background: #0a0a0f; color: #ccc; display: flex;
         justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .card { background: #14141e; border: 1px solid #333; border-radius: 12px;
          padding: 24px; width: 100%; max-width: 340px; }
  h1 { font-size: 16px; color: #fff; margin-bottom: 16px; text-align: center; }
  label { display: block; margin-bottom: 4px; color: #888; font-size: 12px; }
  input { width: 100%; padding: 10px; background: #1a1a2e; border: 1px solid #444;
          border-radius: 6px; color: #fff; font: 14px monospace; margin-bottom: 12px; }
  button { width: 100%; padding: 12px; background: #1a1a2e; border: 1px solid #4af;
           border-radius: 6px; color: #4af; font: 14px monospace; cursor: pointer; }
  button:active { background: #222; }
  .status { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 12px;
            text-align: center; display: none; }
  .ok { display: block; background: #0a2a0a; border: 1px solid #2a6; color: #6c6; }
  .err { display: block; background: #2a0a0a; border: 1px solid #a33; color: #f66; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Dev Sign-In</h1>
  <label>Email</label>
  <input id="email" type="email" autocomplete="email">
  <label>Password</label>
  <input id="pass" type="password" autocomplete="current-password">
  <button onclick="go()">Sign In</button>
  <div id="status" class="status"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
  var SB_URL = 'https://ewfvyrhlsanzkmozrmhs.supabase.co';
  var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3ZnZ5cmhsc2Fuemttb3pybWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNjkxODksImV4cCI6MjEwNDc0NTE4OX0.kxDXQnueexwstqLeZNJdlITffqTHulaV6z-Rdb0ZJQE';
  var sb = supabase.createClient(SB_URL, SB_ANON);
  var st = document.getElementById('status');

  async function go() {
    st.className = 'status';
    st.style.display = 'none';
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('pass').value;
    if (!email || !pass) { show('Enter email and password', true); return; }
    try {
      var res = await sb.auth.signInWithPassword({ email: email, password: pass });
      if (res.error) { show(res.error.message, true); return; }
      show('Signed in ✓ — go to dailyrollover.com/?lab and fly into the valley. The auth gate will appear.');
    } catch (e) { show(String(e), true); }
  }

  function show(msg, err) {
    st.textContent = msg;
    st.className = 'status ' + (err ? 'err' : 'ok');
  }

  // check if already signed in
  sb.auth.getSession().then(function(r) {
    if (r.data && r.data.session) {
      show('Already signed in as ' + r.data.session.user.email + ' ✓');
    }
  });
</script>
</body>
</html>
