<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>The Lab · Rodin body</title>
  <style>
    :root { --ink: #f1e9d8; --muted: #a99d88; --glass: rgba(14, 11, 10, 0.86); --line: rgba(232, 220, 192, 0.22); --gold: #d9b45a; --on: #e8dcc0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0e0b0a; color: var(--ink); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    #rodinCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .bar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
    .bar > * { pointer-events: auto; }
    .title { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; color: var(--gold); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; }
    .title b { color: var(--ink); font-weight: 600; letter-spacing: 0.02em; text-transform: none; }
    .spacer { flex: 1; }
    a.out { font-size: 12px; color: var(--muted); text-decoration: none; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; }
    .dock { position: fixed; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; display: grid; gap: 6px; }
    .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 5px; align-items: center; }
    .row::-webkit-scrollbar { display: none; }
    .row .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 4px 0 6px; flex: none; }
    .chip { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
    .chip.on { background: var(--on); color: #1a0f0c; }
    .hidden { display: none !important; }
    #note { position: fixed; left: 12px; right: 12px; top: 58px; max-width: 560px; margin: 0 auto; font-size: 12px; color: var(--muted); background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="rodinCanvas" aria-label="A Rodin-made body bound to the lab's skeleton, beside the procedural man"></canvas>

  <div class="bar hidden" id="bar">
    <div class="title">The Lab · <b>Rodin body</b></div>
    <span class="spacer"></span>
    <a class="out" href="./anatomy.html" title="Back to the line of men">Lab</a>
  </div>
  <div id="note" class="hidden">Left: the procedural man. Right: the Rodin mesh on the same skeleton and poses. Drag to turn the view, pinch or wheel to zoom.</div>

  <div class="dock hidden" id="dock">
    <div class="row" role="group" aria-label="Pose">
      <span class="lbl">Pose</span>
      <button type="button" class="chip on" data-pose="stand">Stand</button>
      <button type="button" class="chip" data-pose="walk">Walk</button>
      <button type="button" class="chip" data-pose="jog">Jog</button>
      <button type="button" class="chip" data-pose="crouch">Crouch</button>
      <button type="button" class="chip" data-pose="reach">Reach</button>
      <button type="button" class="chip" data-pose="seat">Seat</button>
    </div>
    <div class="row" role="group" aria-label="Look">
      <span class="lbl">Look</span>
      <button type="button" class="chip on" data-look="ink">Ink</button>
      <button type="button" class="chip" data-look="clay">Clay</button>
      <button type="button" class="chip" data-look="weights">Weights</button>
      <span class="lbl">View</span>
      <button type="button" class="chip on" data-yaw="0">Front</button>
      <button type="button" class="chip" data-yaw="45">3/4</button>
      <button type="button" class="chip" data-yaw="90">Side</button>
      <button type="button" class="chip" data-yaw="180">Back</button>
      <button type="button" class="chip" id="pause">Pause</button>
    </div>
  </div>

  <script type="module" src="./rodin.mjs"></script>
</body>
</html>
