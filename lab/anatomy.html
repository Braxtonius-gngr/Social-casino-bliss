<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>The Lab</title>
  <style>
    :root { --ink: #f1e9d8; --muted: #a99d88; --glass: rgba(14, 11, 10, 0.86); --line: rgba(232, 220, 192, 0.22); --gold: #d9b45a; --on: #e8dcc0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0e0b0a; color: var(--ink); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    #labCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .bar { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
    .bar > * { pointer-events: auto; }
    .title { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; color: var(--gold); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
    .title b { color: var(--ink); font-weight: 600; letter-spacing: 0.02em; text-transform: none; }
    .spacer { flex: 1; }
    .seg { display: inline-flex; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
    .seg button, .chip, .nav button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
    .seg button.on, .chip.on { background: var(--on); color: #1a0f0c; }
    a.out, button.out { font-size: 12px; color: var(--muted); text-decoration: none; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; }
    .dock { position: fixed; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; display: grid; gap: 6px; }
    .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 5px; align-items: center; }
    .row::-webkit-scrollbar { display: none; }
    .row .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 4px 0 6px; flex: none; }
    .nav { justify-content: space-between; }
    .nav button { color: var(--ink); }
    .nav button.on { background: var(--on); color: #1a0f0c; }
    .tools { flex-wrap: wrap; }
    .tools label { display: flex; align-items: center; gap: 8px; flex: 1 1 100%; font-size: 12px; color: var(--muted); padding: 2px 6px; }
    .tools input[type=range] { flex: 1; accent-color: var(--gold); }
    .tools output { color: var(--ink); min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .row select { font: inherit; font-size: 12px; background: #1a1412; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }
    .row .pick { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; flex: none; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .panels > .dev-anatomy-panel { position: relative !important; width: auto !important; max-height: 38vh; }
    /* (the settings folded: only their own toggle row stays) */
    .dock.folded > .row:not(#topRow), .dock.folded > .panels { display: none !important; }
    /* (the bar's Hide: every panel away, the view the whole screen - the GL report stays, folded with its own tap) */
    body.clear .dock, body.clear .dev-anatomy-panel { display: none !important; }
    button.out { font: inherit; font-size: 12px; cursor: pointer; }
    button.out.on { background: var(--on); color: #1a0f0c; }
  </style>
</head>
<body>
  <canvas id="labCanvas" aria-label="The lab: a lineup of men for tuning the figures"></canvas>

  <div class="bar hidden" id="bar">
    <div class="title">The Lab · <b id="who">All</b> <span id="stamp" style="opacity:.55;font-weight:normal"></span></div>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Look">
      <button type="button" data-look="ink" class="on">Ink</button>
      <button type="button" data-look="studio">Studio</button>
    </div>
    <button type="button" class="out" id="clear" title="Hide every panel for a clear view (tap again for them back)">◱ Hide</button>
    <a class="out" href="./cloth.html" title="The GPU cloth material on a skinned limb">Cloth</a>
    <a class="out" href="../?lab=valley" title="Tune over the valley instead">Valley</a>
  </div>

  <div class="dock hidden" id="dock">
    <div class="row" id="topRow">
      <button type="button" class="chip" id="dockFold" aria-label="Fold the settings away">▾ Settings</button>
      <button type="button" class="chip" id="cmp">Compare</button>
      <span class="pick hidden" id="cmpPicks">
        <label class="pick">A <select id="cmpA" aria-label="Model A: build"></select></label>
        <label class="pick">B <select id="cmpB" aria-label="Model B: build"></select></label>
        <button type="button" class="chip" id="cmpCopy" title="Give B the same slider values as A">A → B</button>
      </span>
    </div>
    <div class="panels hidden" id="panels"></div>
    <div class="row tools hidden" id="tools"></div>
    <div class="row" role="group" aria-label="Pose">
      <span class="lbl">Pose</span>
      <button type="button" class="chip on" data-pose="stand">Stand</button>
      <button type="button" class="chip" data-pose="walk">Walk</button>
      <button type="button" class="chip" data-pose="jog">Jog</button>
      <button type="button" class="chip" data-pose="rope">Jump rope</button>
      <button type="button" class="chip" data-pose="jump">Jump</button>
      <button type="button" class="chip" data-pose="climb">Climb</button>
      <button type="button" class="chip" data-pose="seat">Seated</button>
      <button type="button" class="chip" data-pose="hung">Hung</button>
    </div>
    <div class="row" role="group" aria-label="Outfit">
      <span class="lbl">Wear</span>
      <button type="button" class="chip" id="wearView" title="Cycle how the outfit is drawn: normal, see-through, wire, hidden">Garment: Normal</button>
      <button type="button" class="chip" data-outfit="compression">Compression</button>
      <button type="button" class="chip" data-outfit="minimal">Brief</button>
      <button type="button" class="chip" data-outfit="hose">Hose</button>
      <button type="button" class="chip" data-outfit="both">Shirt + hose</button>
      <button type="button" class="chip" data-outfit="boxerBriefs">Boxer briefs</button>
      <button type="button" class="chip" data-outfit="longJohns">Long johns</button>
      <button type="button" class="chip" data-outfit="boxers">Boxers</button>
      <button type="button" class="chip on" data-outfit="loin">Loincloth</button>
      <button type="button" class="chip" data-outfit="shirt">Shirt only</button>
      <button type="button" class="chip" data-outfit="none">None</button>
    </div>
    <div class="row hidden" role="group" aria-label="None's paint" id="paintRow">
      <span class="lbl">Paint</span>
      <button type="button" class="chip on" data-paint="orange">Orange (see-through)</button>
      <button type="button" class="chip" data-paint="split">Lobes blue / red</button>
      <button type="button" class="chip" data-paint="brown">Brown (opaque)</button>
    </div>
    <div class="row" role="group" aria-label="Face">
      <span class="lbl">Face</span>
      <button type="button" class="chip on" data-face="auto">Auto</button>
      <button type="button" class="chip" data-face="calm">Calm</button>
      <button type="button" class="chip" data-face="effort">Effort</button>
      <button type="button" class="chip" data-face="pain">Pain</button>
      <button type="button" class="chip" data-face="valley">Valley scream</button>
    </div>
    <div class="row" role="group" aria-label="Face shape" id="shapeRow">
      <span class="lbl">Shape</span>
      <button type="button" class="chip on" data-shape="auto">Each his own</button>
    </div>
    <div class="row nav" role="group" aria-label="Camera">
      <button type="button" id="prev" aria-label="Previous man">‹</button>
      <button type="button" data-frame="all" class="on">All</button>
      <button type="button" data-frame="full">Full</button>
      <button type="button" data-frame="close">Close-up</button>
      <button type="button" id="next" aria-label="Next man">›</button>
    </div>
  </div>

  <script type="module" src="./anatomy.mjs"></script>
</body>
</html>
