<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-base); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg-base); }
  .cv svg { position: absolute; inset: 0; }
  .gold { fill: var(--accent-gold); } .silver { fill: var(--accent-silver); } .green { fill: var(--accent-green); }
  .bronze { fill: var(--accent-bronze); } .pink { fill: var(--accent-pink); }
  .ink { fill: var(--bg-base); } .ring { fill: none; stroke: var(--bg-base); stroke-width: 8px; }
  .blk { rx: var(--radius-pill); }
  .name { position: absolute; left: 40px; bottom: 64px; max-width: 440px; margin: 0; font-family: var(--font-serif); font-weight: 700; font-size: 80px; line-height: 0.95; letter-spacing: 0.01em; color: var(--text-main); }
  .name span { color: var(--accent-gold); }
  .tag { position: absolute; left: 40px; bottom: 32px; max-width: 440px; margin: 0; font-family: var(--font-serif); font-style: italic; font-size: 14px; color: var(--text-muted); }
</style></head>
<body>
<div class="cv">
  <!-- blocks: accent-gold 200×232 (the brand), accent-silver 224×96, accent-green 112×184, accent-bronze 96×96, accent-pink 96×72 (state, small); corners radius-pill (20px)
       arrangement: one tall gold slab with satellites to its right, silver and green bleeding off the top, right and bottom edges, all right of x=480
       pattern: literal motif (coin / chip) — "gold means money": two concentric rings cut from the gold slab in bg-base, and a row of six chip discs on the silver block
       scales: gaps space-16, disc pitch space-24 with r=space-6, ring stroke space-8, blocks on 8px multiples -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="gold blk" x="512" y="-20" width="200" height="252" rx="20"/>
    <circle class="ring" cx="612" cy="112" r="72"/>
    <circle class="ring" cx="612" cy="112" r="44"/>
    <rect class="silver blk" x="728" y="-20" width="252" height="116" rx="20"/>
    <circle class="ink" cx="768" cy="56" r="6"/><circle class="ink" cx="792" cy="56" r="6"/><circle class="ink" cx="816" cy="56" r="6"/>
    <circle class="ink" cx="840" cy="56" r="6"/><circle class="ink" cx="864" cy="56" r="6"/><circle class="ink" cx="888" cy="56" r="6"/>
    <rect class="green blk" x="728" y="112" width="112" height="196" rx="20"/>
    <rect class="bronze blk" x="856" y="112" width="96" height="96" rx="20"/>
    <rect class="pink blk" x="856" y="224" width="120" height="84" rx="20"/>
  </svg>
  <h1 class="name">Daily<br><span>Roll Over</span></h1>
  <p class="tag">Your Daily Roll&rsquo;s Over</p>
</div>
</body>
</html>
