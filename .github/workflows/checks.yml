name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      # Headless Chrome (preinstalled on GitHub's Ubuntu runners) against a
      # recording fake of Supabase: sign-in, sync, checkout, push, deletion.
      - run: npm run test:smoke
