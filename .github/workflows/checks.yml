name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      # Headless Chrome (preinstalled on GitHub's Ubuntu runners) against a
      # recording fake of Supabase: sign-in, sync, checkout, push, deletion.
      - run: npm run test:smoke
      # sw.js's push handler against fakes: drop alerts and ready alerts.
      - run: npm run test:sw
      # The deploy step: dist/ with every script minified and no catalogue
      # file, then the same smoke tests against that output.
      - run: npm ci
      - run: npm run build:site
      - run: SMOKE_ROOT=dist npm run test:smoke
      # The edge functions' pure parts: drop matching, image and answer checks.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/web-push/ supabase/functions/read-drop/extract_test.ts supabase/functions/go/redirect_test.ts supabase/functions/bug-report/report_test.ts supabase/functions/wish-3d/fal_test.ts
      # read-drop's entry point, type-checked: the tests above never import
      # it, so a merge once left it declaring its Claude client twice and
      # CI stayed green. DENO_NO_PACKAGE_JSON stops Deno resolving its npm:
      # import against the site's own package.json and node_modules.
      - run: deno check supabase/functions/read-drop/index.ts supabase/functions/bug-report/index.ts
        env:
          DENO_NO_PACKAGE_JSON: "1"
